schema_version: 2
metadata:
  key: generic_runtime
  name: 医疗急救
  description: 在小型诊所中诊断并稳定患者病情。
  locality:
    enabled: false
    scoped_resources: false
    region_node_type_key: null
    facility_node_type_key: null
    transport_node_type_key: null
    located_in_relation_type_key: null
    transport_endpoint_relation_type_key: null
    passability_fact_key: null
engine_contract:
  key: declarative-rule-engine
  version: '1'
initialization:
  start_node_key: triage_room
  primary_actor_key: doctor_lee
  resource_initial_states: []
world:
  key: generic_runtime
  name: 医疗急救
  node_types:
  - key: cabinet
    name: 药柜
    description: ''
  - key: patient
    name: 患者
    description: ''
  - key: room
    name: 房间
    description: ''
  nodes:
  - key: medicine_cabinet
    name: 药品柜
    description: 诊所的药品储存处。
    node_type_key: cabinet
    initial_access: AVAILABLE
    initial_visibility: KNOWN
    interaction_keys:
    - restockable
    facts: []
  - key: patient_one
    name: 一号患者
    description: 一名需要治疗的患者。
    node_type_key: patient
    initial_access: AVAILABLE
    initial_visibility: KNOWN
    interaction_keys:
    - diagnosable
    - treatable
    facts:
    - key: diagnosis
      name: 诊断结果
      description: ''
      value_type: ENUM
      initial_value: UNKNOWN
      initial_visibility: KNOWN
      allowed_values:
      - INFECTION
      - UNKNOWN
    - key: stable
      name: 病情稳定
      description: ''
      value_type: BOOLEAN
      initial_value: false
      initial_visibility: KNOWN
      allowed_values: []
  - key: triage_room
    name: 分诊室
    description: 诊所的初始治疗室。
    node_type_key: room
    initial_access: AVAILABLE
    initial_visibility: KNOWN
    interaction_keys: []
    facts: []
  relations:
  - source_node_key: triage_room
    relation_type_key: contains
    target_node_key: medicine_cabinet
  - source_node_key: triage_room
    relation_type_key: contains
    target_node_key: patient_one
  resources:
  - key: medicine
    name: 药品
    description: ''
    initial_value: 5
    minimum: 0
    maximum: 20
    reservation_supported: true
actors:
  roles:
  - key: nurse
    name: 护士
    description: ''
    capabilities:
    - EXECUTE_ACTION
    - INSPECT_STATE
  - key: physician
    name: 医生
    description: ''
    capabilities:
    - EXECUTE_ACTION
    - INSPECT_STATE
    - PLAN
  actor_profiles:
  - key: doctor_lee
    name: 李医生
    role_key: physician
    persona: 一位谨慎细致的急诊医生。
    doctrine:
    - key: treatment_priority
      value: SAFETY
    initial_node_key: triage_room
    allowed_action_keys:
    - diagnose_patient
    - treat_patient
    authority_policy:
      autonomous_limits: []
      approval_required_values: []
  - key: nurse_ana
    name: 安娜护士
    role_key: nurse
    persona: 一位操作严谨的临床护士。
    doctrine: []
    initial_node_key: triage_room
    allowed_action_keys:
    - treat_patient
    authority_policy:
      autonomous_limits: []
      approval_required_values: []
interactions:
- key: diagnosable
  name: 可诊断
  description: ''
- key: restockable
  name: 可补充库存
  description: ''
- key: treatable
  name: 可治疗
  description: ''
actions:
- key: diagnose_patient
  name: 诊断患者
  description: ''
  required_interaction_key: diagnosable
  execution_mode: IMMEDIATE
  parameters: []
  allowed_actor_capabilities:
  - EXECUTE_ACTION
  authority_policy:
    autonomous_limits: []
    approval_required_values: []
  expected_outcomes:
  - code: DIAGNOSED
    name: 已诊断
    success: true
  planning:
    terminal_effects:
    - node_key: patient_one
      fact_key: diagnosis
    supporting_effects: []
    success_outcome_codes:
    - DIAGNOSED
    wait_success_outcome_codes: []
    hints: []
  behavior: RULE
  locality: NONE
- key: treat_patient
  name: 治疗患者
  description: ''
  required_interaction_key: treatable
  execution_mode: IMMEDIATE
  parameters:
  - key: dosage
    name: 剂量
    value_type: INTEGER
    required: false
    minimum: 1
    maximum: 5
    allowed_values: []
    default: 2
  allowed_actor_capabilities:
  - EXECUTE_ACTION
  authority_policy:
    autonomous_limits: []
    approval_required_values: []
  expected_outcomes:
  - code: DIAGNOSIS_REQUIRED
    name: 需要诊断
    success: false
  - code: STABILIZED
    name: 病情已稳定
    success: true
  planning:
    terminal_effects:
    - node_key: patient_one
      fact_key: stable
    supporting_effects: []
    success_outcome_codes:
    - STABILIZED
    wait_success_outcome_codes: []
    hints: []
  behavior: RULE
  locality: NONE
