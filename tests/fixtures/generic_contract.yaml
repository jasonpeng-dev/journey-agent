objectives:
- key: diagnose_patient
  name: 诊断患者
  description: 确定一号患者的病情。
  completion_requirements:
  - key: diagnosis_known
    node_key: patient_one
    fact_key: diagnosis
    accepted_values:
    - INFECTION
    description: 已经明确患者诊断。
  prerequisites: []
  subsumes: []
  goal_aliases:
  - diagnose the patient
  - identify the illness
  - 确定病情
  - 诊断患者
  goal_examples: []
- key: stabilize_patient
  name: 稳定患者病情
  description: 使一号患者的病情稳定。
  completion_requirements:
  - key: patient_stable
    node_key: patient_one
    fact_key: stable
    accepted_values:
    - true
    description: 一号患者的病情已经稳定。
  prerequisites:
  - key: diagnosis_required
    description: 治疗前必须明确诊断。
    requirements:
    - key: diagnosis_known
      node_key: patient_one
      fact_key: diagnosis
      accepted_values:
      - INFECTION
      description: 已经明确患者诊断。
  subsumes: []
  goal_aliases:
  - stabilize the patient
  - treat patient one
  - 治疗一号患者
  - 稳定患者病情
  goal_examples: []
goal_resolution:
  allow_llm_fallback: true
  clarification_prompt: 你希望诊断患者，还是稳定患者病情？
planning:
  instructions:
  - 先诊断再治疗，并节约使用药品。
  recovery_hints:
  - failure_code: DIAGNOSIS_REQUIRED
    hint: 再次治疗前先诊断目标患者。
