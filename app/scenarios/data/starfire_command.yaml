schema_version: 2
metadata:
  key: starfire_command
  name: 星火战略指挥部
  description: 收复北部山谷、修复星火前哨并重新开放贸易路线。
  locality:
    enabled: false
    scoped_resources: false
    region_node_type_key: null
    facility_node_type_key: null
    transport_node_type_key: null
    located_in_relation_type_key: null
    transport_endpoint_relation_type_key: null
    passability_fact_key: null
engine_contract:
  key: declarative-rule-engine
  version: '1'
initialization:
  start_node_key: capital_council
  primary_actor_key: shen_ce
  resource_initial_states: []
world:
  key: starfire_command
  name: 星火战略指挥部
  node_types:
  - key: facility
    name: 设施
    description: ''
  - key: headquarters
    name: 指挥部
    description: ''
  - key: location
    name: 地点
    description: ''
  - key: route
    name: 路线
    description: ''
  - key: settlement
    name: 聚落
    description: ''
  nodes:
  - key: capital_council
    name: 首都议事厅
    description: 战略指挥中枢。
    node_type_key: headquarters
    initial_access: AVAILABLE
    initial_visibility: KNOWN
    interaction_keys: []
    facts: []
  - key: enemy_north_supply_route
    name: 敌军北部补给线
    description: 为伏击部队提供支援的隐蔽后勤路线。
    node_type_key: route
    initial_access: LOCKED
    initial_visibility: HIDDEN
    interaction_keys:
    - disrupt_supply
    facts:
    - key: supply_status
      name: 补给状态
      description: ''
      value_type: ENUM
      initial_value: ACTIVE
      initial_visibility: HIDDEN
      allowed_values:
      - ACTIVE
      - DISRUPTED
  - key: north_village
    name: 北部村庄
    description: 可提供情报、向导和补给的村庄。
    node_type_key: settlement
    initial_access: AVAILABLE
    initial_visibility: KNOWN
    interaction_keys:
    - negotiate_support
    facts:
    - key: village_support
      name: 村庄支援
      description: ''
      value_type: ENUM
      initial_value: NONE
      initial_visibility: KNOWN
      allowed_values:
      - GUIDE
      - INTELLIGENCE
      - NONE
      - SUPPLIES
  - key: northern_trade_route
    name: 北部贸易路线
    description: 需要安全山谷与正常运作前哨共同保障的贸易路线。
    node_type_key: route
    initial_access: LOCKED
    initial_visibility: KNOWN
    interaction_keys:
    - test_trade_route
    facts:
    - key: trade_route_status
      name: 贸易路线状态
      description: ''
      value_type: ENUM
      initial_value: CLOSED
      initial_visibility: KNOWN
      allowed_values:
      - CLOSED
      - OPEN
  - key: northern_valley
    name: 北部山谷
    description: 通往前哨、正受到威胁的要道。
    node_type_key: location
    initial_access: AVAILABLE
    initial_visibility: KNOWN
    interaction_keys:
    - clear_threat
    - reconnaissance
    facts:
    - key: ambush_status
      name: 伏击状态
      description: ''
      value_type: ENUM
      initial_value: ACTIVE
      initial_visibility: HIDDEN
      allowed_values:
      - ACTIVE
      - CLEARED
    - key: valley_intelligence
      name: 山谷情报
      description: ''
      value_type: ENUM
      initial_value: INCOMPLETE
      initial_visibility: KNOWN
      allowed_values:
      - COMPLETE
      - INCOMPLETE
      - PARTIAL
    - key: valley_security
      name: 山谷安全
      description: ''
      value_type: ENUM
      initial_value: UNSAFE
      initial_visibility: KNOWN
      allowed_values:
      - SAFE
      - UNSAFE
  - key: starfire_outpost
    name: 星火前哨
    description: 一处受损的北部设施。
    node_type_key: facility
    initial_access: LOCKED
    initial_visibility: KNOWN
    interaction_keys:
    - repair
    facts:
    - key: outpost_status
      name: 前哨状态
      description: ''
      value_type: ENUM
      initial_value: DAMAGED
      initial_visibility: KNOWN
      allowed_values:
      - DAMAGED
      - OPERATIONAL
      - RESTORED
  relations:
  - source_node_key: enemy_north_supply_route
    relation_type_key: supports
    target_node_key: northern_valley
  - source_node_key: north_village
    relation_type_key: supports
    target_node_key: northern_trade_route
  - source_node_key: north_village
    relation_type_key: supports
    target_node_key: northern_valley
  - source_node_key: northern_valley
    relation_type_key: enables
    target_node_key: northern_trade_route
  - source_node_key: northern_valley
    relation_type_key: reveals
    target_node_key: enemy_north_supply_route
  - source_node_key: northern_valley
    relation_type_key: unlocks
    target_node_key: starfire_outpost
  - source_node_key: starfire_outpost
    relation_type_key: enables
    target_node_key: northern_trade_route
  resources:
  - key: food
    name: 粮食
    description: ''
    initial_value: 100
    minimum: 0
    maximum: null
    reservation_supported: false
  - key: gold
    name: 金币
    description: ''
    initial_value: 80
    minimum: 0
    maximum: null
    reservation_supported: false
  - key: morale
    name: 士气
    description: ''
    initial_value: 60
    minimum: 0
    maximum: 100
    reservation_supported: false
  - key: soldiers
    name: 士兵
    description: ''
    initial_value: 300
    minimum: 0
    maximum: null
    reservation_supported: false
actors:
  roles:
  - key: general
    name: 将军
    description: ''
    capabilities:
    - EXECUTE_ACTION
    - INSPECT_STATE
  - key: steward
    name: 内政官
    description: ''
    capabilities:
    - EXECUTE_ACTION
    - INSPECT_STATE
  - key: strategist
    name: 军师
    description: ''
    capabilities:
    - EXECUTE_ACTION
    - INSPECT_STATE
    - PLAN
  actor_profiles:
  - key: han_lie
    name: 韩烈
    role_key: general
    persona: 果断的前线指挥官。
    doctrine: []
    initial_node_key: capital_council
    allowed_action_keys:
    - clear_valley
    - disrupt_supply
    - recon_valley
    authority_policy:
      autonomous_limits: []
      approval_required_values: []
  - key: lu_ning
    name: 陆宁
    role_key: steward
    persona: 重视资源调配的内政官。
    doctrine: []
    initial_node_key: capital_council
    allowed_action_keys:
    - negotiate_support
    - repair_outpost
    - test_trade_route
    authority_policy:
      autonomous_limits: []
      approval_required_values: []
  - key: shen_ce
    name: 沈策
    role_key: strategist
    persona: 谨慎的军师，重视情报并尽量减少伤亡。
    doctrine:
    - key: risk_preference
      value: LOW
    initial_node_key: capital_council
    allowed_action_keys:
    - clear_valley
    - disrupt_supply
    - negotiate_support
    - recon_valley
    - repair_outpost
    - test_trade_route
    authority_policy:
      autonomous_limits:
      - parameter_key: food_commitment
        maximum: 30
      - parameter_key: food_offer
        maximum: 30
      - parameter_key: gold_commitment
        maximum: 40
      - parameter_key: troop_count
        maximum: 200
      approval_required_values: []
interactions:
- key: clear_threat
  name: 清除威胁
  description: ''
- key: disrupt_supply
  name: 破坏补给
  description: ''
- key: negotiate_support
  name: 协商支援
  description: ''
- key: reconnaissance
  name: 侦察
  description: ''
- key: repair
  name: 修复
  description: ''
- key: test_trade_route
  name: 测试贸易路线
  description: ''
actions:
- key: clear_valley
  name: 确保北部山谷安全
  description: ''
  required_interaction_key: clear_threat
  execution_mode: ASYNC
  parameters:
  - key: strategy
    name: 策略
    value_type: ENUM
    required: false
    minimum: null
    maximum: null
    allowed_values:
    - AGGRESSIVE
    - CAUTIOUS
    - STANDARD
    default: STANDARD
  - key: troop_count
    name: 兵力
    value_type: INTEGER
    required: false
    minimum: 1
    maximum: 300
    allowed_values: []
    default: 80
  allowed_actor_capabilities:
  - EXECUTE_ACTION
  authority_policy:
    autonomous_limits: []
    approval_required_values: []
  expected_outcomes:
  - code: ENCOUNTER_DEFEAT
    name: 遭遇战失利
    success: false
  - code: VICTORY
    name: 胜利
    success: true
  planning:
    terminal_effects:
    - node_key: northern_valley
      fact_key: valley_security
    supporting_effects: []
    success_outcome_codes:
    - VICTORY
    wait_success_outcome_codes:
    - VICTORY
    hints: []
  behavior: RULE
  locality: NONE
- key: disrupt_supply
