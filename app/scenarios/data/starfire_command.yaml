  - key: gold_commitment
    name: 投入金币
    value_type: INTEGER
    required: false
    minimum: 0
    maximum: 80
    allowed_values: []
    default: 40
  - key: repair_level
    name: 修复等级
    value_type: ENUM
    required: false
    minimum: null
    maximum: null
    allowed_values:
