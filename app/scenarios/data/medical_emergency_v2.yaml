schema_version: 2
metadata:
  key: medical_emergency
  name: 医疗急救
  description: 在小型诊所中诊断并稳定患者病情。
engine_contract: {key: declarative-rule-engine, version: "1"}
initialization: {start_node_key: triage_room, primary_actor_key: doctor_lee}
world:
  key: medical_emergency
  name: 医疗急救
  node_types:
    - {key: room, name: 房间}
    - {key: patient, name: 患者}
    - {key: cabinet, name: 药柜}
  nodes:
    - key: triage_room
      name: 分诊室
      description: 诊所的初始治疗室。
      node_type_key: room
      initial_access: AVAILABLE
      initial_visibility: KNOWN
    - key: patient_one
      name: 一号患者
      description: 一名需要治疗的患者。
      node_type_key: patient
      initial_access: AVAILABLE
      initial_visibility: KNOWN
      interaction_keys: [diagnosable, treatable]
      facts:
        - {key: diagnosis, name: 诊断结果, value_type: ENUM, initial_value: UNKNOWN, initial_visibility: KNOWN, allowed_values: [UNKNOWN, INFECTION]}
        - {key: stable, name: 病情稳定, value_type: BOOLEAN, initial_value: false, initial_visibility: KNOWN}
    - key: medicine_cabinet
      name: 药品柜
      description: 诊所的药品储存处。
      node_type_key: cabinet
      initial_access: AVAILABLE
      initial_visibility: KNOWN
      interaction_keys: [restockable]
  relations:
    - {source_node_key: triage_room, relation_type_key: contains, target_node_key: patient_one}
    - {source_node_key: triage_room, relation_type_key: contains, target_node_key: medicine_cabinet}
  resources:
    - {key: medicine, name: 药品, initial_value: 5, minimum: 0, maximum: 20, reservation_supported: true}
actors:
  roles:
    - {key: physician, name: 医生, capabilities: [PLAN, EXECUTE_ACTION, INSPECT_STATE]}
    - {key: nurse, name: 护士, capabilities: [EXECUTE_ACTION, INSPECT_STATE]}
  actor_profiles:
    - key: doctor_lee
      name: 李医生
      role_key: physician
      persona: 一位谨慎细致的急诊医生。
      doctrine: [{key: treatment_priority, value: SAFETY}]
      initial_node_key: triage_room
      allowed_action_keys: [diagnose_patient, treat_patient]
    - key: nurse_ana
      name: 安娜护士
      role_key: nurse
      persona: 一位操作严谨的临床护士。
      initial_node_key: triage_room
      allowed_action_keys: [treat_patient]
interactions:
  - {key: diagnosable, name: 可诊断}
  - {key: treatable, name: 可治疗}
  - {key: restockable, name: 可补充库存}
actions:
  - key: diagnose_patient
    name: 诊断患者
    required_interaction_key: diagnosable
    execution_mode: IMMEDIATE
    allowed_actor_capabilities: [EXECUTE_ACTION]
    expected_outcomes: [{code: DIAGNOSED, name: 已诊断, success: true}]
    planning:
      terminal_effects: [{node_key: patient_one, fact_key: diagnosis}]
      success_outcome_codes: [DIAGNOSED]
  - key: treat_patient
    name: 治疗患者
    required_interaction_key: treatable
    execution_mode: IMMEDIATE
    parameters:
      - {key: dosage, name: 剂量, value_type: INTEGER, required: false, minimum: 1, maximum: 5, default: 2}
    allowed_actor_capabilities: [EXECUTE_ACTION]
    expected_outcomes:
      - {code: STABILIZED, name: 病情已稳定, success: true}
      - {code: DIAGNOSIS_REQUIRED, name: 需要诊断, success: false}
    planning:
      terminal_effects: [{node_key: patient_one, fact_key: stable}]
      success_outcome_codes: [STABILIZED]
rules:
  - key: diagnosis_complete
    phase: RESOLVE
    action_key: diagnose_patient
    priority: 0
    effects:
      - {kind: SET_FACT, node: {kind: CURRENT_TARGET}, fact_key: diagnosis, value: {source: LITERAL, literal: INFECTION}}
      - {kind: EMIT_OUTCOME, outcome_code: DIAGNOSED}
  - key: treatment_needs_diagnosis
    phase: PREFLIGHT
    action_key: treat_patient
    priority: 100
    condition: {kind: FACT_EQUALS, node: {kind: CURRENT_TARGET}, fact_key: diagnosis, value: UNKNOWN}
    effects:
      - {kind: EMIT_FAILURE, failure_code: DIAGNOSIS_REQUIRED, message: 治疗前必须先诊断患者。, retryable: true}
  - key: treatment_stabilizes
    phase: RESOLVE
    action_key: treat_patient
    priority: 0
    effects:
      - {kind: SET_FACT, node: {kind: CURRENT_TARGET}, fact_key: stable, value: {source: LITERAL, literal: true}}
      - {kind: ADJUST_RESOURCE, resource_key: medicine, amount: {source: PARAMETER, parameter_key: dosage, multiplier: -1}}
      - {kind: WRITE_MEMORY_EVENT, memory_key: patient_stabilized, memory_content: 一号患者的病情已经稳定。}
      - {kind: EMIT_OUTCOME, outcome_code: STABILIZED}
objectives:
  - key: diagnose_patient
    name: 诊断患者
    description: 确定一号患者的病情。
    completion_requirements:
      - {key: diagnosis_known, node_key: patient_one, fact_key: diagnosis, accepted_values: [INFECTION], description: 已经明确患者诊断。}
    goal_aliases: [diagnose the patient, identify the illness, 诊断患者, 确定病情]
  - key: stabilize_patient
    name: 稳定患者病情
    description: 使一号患者的病情稳定。
    completion_requirements:
      - {key: patient_stable, node_key: patient_one, fact_key: stable, accepted_values: [true], description: 一号患者的病情已经稳定。}
    prerequisites:
      - key: diagnosis_required
        description: 治疗前必须明确诊断。
        requirements:
          - {key: diagnosis_known, node_key: patient_one, fact_key: diagnosis, accepted_values: [INFECTION], description: 已经明确患者诊断。}
    goal_aliases: [stabilize the patient, treat patient one, 稳定患者病情, 治疗一号患者]
goal_resolution:
  allow_llm_fallback: true
  clarification_prompt: 你希望诊断患者，还是稳定患者病情？
planning:
  instructions: [先诊断再治疗，并节约使用药品。]
  recovery_hints:
    - {failure_code: DIAGNOSIS_REQUIRED, hint: 再次治疗前先诊断目标患者。}
