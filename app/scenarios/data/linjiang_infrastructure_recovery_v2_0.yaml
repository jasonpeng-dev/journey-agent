  name: 建立全城灾后持续应急保障网络
  description: 建立持续物流与救援物资部署。
  completion_requirements:
  - key: sustained_logistics
    node_key: city_distribution_center
    fact_key: sustained_humanitarian_logistics
    accepted_values:
