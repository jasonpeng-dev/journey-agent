objectives:
- key: restore_central_communication_capability
  name: 恢复中央通信能力
  description: 恢复中央通信核心并重新建立城市调度联络。
  completion_requirements:
  - key: central_telecom_operational
    node_key: central_telecom_hub
    fact_key: operational
    accepted_values:
    - true
    description: 中央通信核心已恢复运行。
  prerequisites: []
  subsumes: []
  goal_aliases:
  - Restore central communications
  - 恢复中央通信核心
  goal_examples: []
  planning_guidance: 优先恢复中央通信核心；遵循已知的地点、通道和资源条件。
- key: restore_east_emergency_power_network
  name: 恢复东部应急供电网络
