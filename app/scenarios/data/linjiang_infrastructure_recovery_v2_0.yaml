objectives:
- key: restore_central_communication_capability
  name: 恢复中央通信能力
  description: 恢复中央通信核心并重新建立城市调度联络。
  completion_requirements:
  - key: central_telecom_operational
    node_key: central_telecom_hub
    fact_key: operational
    accepted_values:
    - true
    description: 中央通信核心已恢复运行。
  prerequisites: []
  subsumes: []
  goal_aliases:
  - Restore central communications
  - 恢复中央通信核心
  goal_examples: []
  planning_guidance: 优先恢复中央通信核心；遵循已知的地点、通道和资源条件。
- key: restore_east_emergency_power_network
  name: 恢复东部应急供电网络
  description: 恢复东部配电与东部应急设施的供电能力。
  completion_requirements:
  - key: east_hospital_operational
    node_key: east_community_hospital
    fact_key: operational
    accepted_values:
    - true
    description: 东区社区医院已恢复运行。
  - key: east_hospital_power
    node_key: east_community_hospital
    fact_key: power_supply
    accepted_values:
    - AVAILABLE
    description: 东区社区医院已获得供电。
  - key: riverside_shelter_operational
    node_key: riverside_shelter
    fact_key: operational
    accepted_values:
    - true
    description: 河滨避难所已恢复运行。
  - key: riverside_shelter_power
    node_key: riverside_shelter
    fact_key: power_supply
    accepted_values:
    - AVAILABLE
    description: 河滨避难所已获得供电。
  prerequisites: []
  subsumes: []
  goal_aliases:
  - Restore east emergency power
  - 恢复东部应急供电
  goal_examples: []
  planning_guidance: 依据已知的电力拓扑连续修复、供电并校验两个东部设施。
- key: restore_east_emergency_water_supply
  name: 恢复东部应急供水
  description: 恢复东部应急供水调度能力。
  completion_requirements:
  - key: east_emergency_water_supply
    node_key: east_water_pump_station
    fact_key: east_emergency_water_supply
    accepted_values:
    - AVAILABLE
    description: 东部应急供水已可用。
  prerequisites: []
  subsumes: []
  goal_aliases:
  - Restore east emergency water supply
  - 恢复东部应急供水
  goal_examples: []
  planning_guidance: 满足水务设施、供电、重型工程与南部通信协调条件后启动调度。
- key: restore_north_basic_engineering_support
  name: 恢复北部基础工程支援
  description: 恢复北部通信中继与市政工程服务能力。
  completion_requirements:
  - key: north_depot_operational
    node_key: utility_service_depot
    fact_key: operational
    accepted_values:
    - true
    description: 市政工程服务基地已恢复。
  - key: north_relay_operational
    node_key: north_communication_relay
    fact_key: operational
    accepted_values:
    - true
    description: 北部通信中继已恢复。
  prerequisites: []
  subsumes: []
  goal_aliases:
  - Restore north engineering support
  - 恢复北部基础工程支援
  goal_examples: []
  planning_guidance: 先确认北部通道与通信条件，再按专业队与已知资源编排修复。
goal_resolution:
  allow_llm_fallback: true
  clarification_prompt: 请说明希望恢复的基础设施或公共服务。
planning:
  instructions:
  - 只使用当前 Knowledge 中已知的地点、关系、资源与设施状态。
  - 资源使用前确认 source Region 的已知可用数量；不要选择 pool_key。
  - 依次检查 Actor 的在线状态、区域归属和已知工程条件。
  recovery_hints:
  - failure_code: RESOURCE_SURVEY_ALREADY_COMPLETED
    hint: 已完成的资源 Survey 不要重复执行。
  - failure_code: TRANSPORT_RESOURCE_INSUFFICIENT
    hint: 资源数量不足时重新检查已知库存与解锁条件。
  - failure_code: TRAVEL_BLOCKED
    hint: 保留已完成步骤，读取新揭示的通行事实后重新评估剩余计划。
