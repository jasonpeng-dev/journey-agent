  prerequisites: []
  subsumes: []
  goal_aliases:
  - 建立全城持续应急保障网络
  goal_examples: []
  planning_guidance: 恢复外援入口、仓储、车辆与配送能力，并把救援物资部署到三个目标区域。
- key: establish_sustained_emergency_generation
  name: 建立持续应急发电保障
  description: 启动并建立东南持续燃料发电保障。
  completion_requirements:
  - key: generation_capability
    node_key: southeast_fuel_emergency_power_plant
    fact_key: sustained_generation_capability
    accepted_values:
    - AVAILABLE
    description: 持续发电能力已建立。
  - key: southeast_fuel_reserve
    kind: RESOURCE_AT_LEAST
    region_key: southeast_heights_district
    resource_key: emergency_fuel
    minimum: 100
    knowledge_gate:
      node_key: southeast_fuel_emergency_power_plant
      fact_key: sustained_requirements_discovered
      accepted_values:
      - true
    description: 东南应急燃料储备至少 100。
  prerequisites: []
  subsumes: []
  goal_aliases:
  - 建立持续应急发电保障
  goal_examples: []
  planning_guidance: 先修复电厂并用启动燃料成功发电；根据新揭示的持续保障条件继续规划。
goal_resolution:
  allow_llm_fallback: true
  clarification_prompt: 请说明希望恢复的基础设施或公共服务。
planning:
  instructions:
  - 只使用当前 Knowledge 中已知的地点、关系、资源与设施状态。
  - 资源使用前确认 source Region 的已知可用数量；不要选择 pool_key。
  - 依次检查 Actor 的在线状态、区域归属和已知工程条件。
  recovery_hints:
  - failure_code: RESOURCE_SURVEY_ALREADY_COMPLETED
    hint: 已完成的资源 Survey 不要重复执行。
  - failure_code: TRANSPORT_RESOURCE_INSUFFICIENT
    hint: 资源数量不足时重新检查已知库存与解锁条件。
  - failure_code: TRAVEL_BLOCKED
    hint: 保留已完成步骤，读取新揭示的通行事实后重新评估剩余计划。
