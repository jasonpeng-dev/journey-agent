  - key: east_hospital_power
    node_key: east_community_hospital
    fact_key: power_supply
    accepted_values:
    - AVAILABLE
    description: 东区社区医院已获得供电。
  - key: riverside_shelter_operational
    node_key: riverside_shelter
    fact_key: operational
    accepted_values:
    - true
