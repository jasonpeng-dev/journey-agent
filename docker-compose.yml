services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Keep the first release self-contained and persistent without PostgreSQL.
      DATABASE_URL: sqlite+pysqlite:////app/data/journey.db
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_NAME: ${MODEL_NAME:-gpt-4.1-mini}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      SEMANTIC_MODEL: ${SEMANTIC_MODEL:-}
      DEVELOPER_API_TOKEN: ${DEVELOPER_API_TOKEN:-}
      PLAN_TIMEOUT_SECONDS: ${PLAN_TIMEOUT_SECONDS:-300}
      PLAN_TOTAL_TIMEOUT_SECONDS: ${PLAN_TOTAL_TIMEOUT_SECONDS:-unlimited}
      GOAL_RESOLUTION_TIMEOUT_SECONDS: ${GOAL_RESOLUTION_TIMEOUT_SECONDS:-20}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-8192}
      MODEL_MAX_REPAIR_ATTEMPTS_PER_CYCLE: ${MODEL_MAX_REPAIR_ATTEMPTS_PER_CYCLE:-2}
      GOAL_RESOLUTION_OBSERVABILITY: ${GOAL_RESOLUTION_OBSERVABILITY:-NORMAL}
    ports:
      - "8000:8000"
    volumes:
      - journey-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=3)
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

volumes:
  journey-data:
