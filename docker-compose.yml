services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      # Keep the first release self-contained and persistent without PostgreSQL.
      DATABASE_URL: sqlite+pysqlite:////app/data/journey.db
      MODEL_PROVIDER: ${MODEL_PROVIDER:-mock}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      MODEL_NAME: ${MODEL_NAME:-gpt-4.1-mini}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      DEVELOPER_API_TOKEN: ${DEVELOPER_API_TOKEN:-}
      MODEL_THINKING_MODE: ${MODEL_THINKING_MODE:-disabled}
      MODEL_REASONING_EFFORT: ${MODEL_REASONING_EFFORT:-low}
      MODEL_TIMEOUT_SECONDS: ${MODEL_TIMEOUT_SECONDS:-20}
      MODEL_TOTAL_TIMEOUT_SECONDS: ${MODEL_TOTAL_TIMEOUT_SECONDS:-60}
      MODEL_MAX_OUTPUT_TOKENS: ${MODEL_MAX_OUTPUT_TOKENS:-8192}
      AGENT_MAX_ROUNDS: ${AGENT_MAX_ROUNDS:-5}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
      PLANNER_MAX_STEPS: ${PLANNER_MAX_STEPS:-10}
      PLANNER_MAX_WAIT_STEPS: ${PLANNER_MAX_WAIT_STEPS:-4}
      PLANNER_MAX_REPLANS: ${PLANNER_MAX_REPLANS:-2}
      PLANNER_MAX_GENERATION_ATTEMPTS: ${PLANNER_MAX_GENERATION_ATTEMPTS:-2}
    ports:
      - "8000:8000"
    volumes:
      - journey-data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=3)
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 20

volumes:
  journey-data:
