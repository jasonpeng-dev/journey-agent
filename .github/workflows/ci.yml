name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: journey_test
          POSTGRES_USER: journey
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U journey -d journey_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://journey:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/journey_test
      MODEL_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check app evals tests
      - run: uv run mypy app evals
      - run: uv run alembic upgrade head
      - run: uv run pytest --cov=app --cov-report=term-missing
      - run: uv run journey-agent eval run --output eval-results
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: eval-results/
