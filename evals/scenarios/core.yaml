- name: full_command_completes
  category: workflow
  kind: workflow
  assertion: task_succeeded

- name: failed_clearance_triggers_replan
  category: workflow
  kind: workflow
  assertion: replan_created

- name: plan_assigns_all_three_officers
  category: workflow
  kind: workflow
  assertion: all_officers_assigned

- name: authority_limit_creates_player_approval
  category: workflow
  kind: workflow
  assertion: player_approval_observed

- name: deterministic_world_reaches_verified_goal
  category: workflow
  kind: workflow
  assertion: final_world_verified

- name: tool_trace_records_before_and_after_state
  category: workflow
  kind: workflow
  assertion: state_audit_recorded

- name: unknown_tool_is_rejected
  category: plan_validation
  kind: plan_validation
  mutation: unknown_tool
  expected_code: PLAN_TOOL_NOT_ALLOWED

- name: cross_role_tool_assignment_is_rejected
  category: plan_validation
  kind: plan_validation
  mutation: unauthorized_officer
  expected_code: PLAN_TOOL_UNAUTHORIZED

- name: world_wait_cannot_accept_defeat
  category: plan_validation
  kind: plan_validation
  mutation: invalid_world_outcome
  expected_code: PLAN_WORLD_EVENT_OUTCOMES_INVALID

- name: operation_and_wait_must_be_adjacent
  category: plan_validation
  kind: plan_validation
  mutation: broken_operation_pair
  expected_code: PLAN_WORLD_EVENT_PAIRING_INVALID

- name: model_cannot_supply_idempotency_key
  category: plan_validation
  kind: plan_validation
  mutation: model_idempotency_key
  expected_code: PLAN_IDEMPOTENCY_SERVER_CONTROLLED

- name: final_strategist_verification_is_required
  category: plan_validation
  kind: plan_validation
  mutation: missing_final_verification
  expected_code: PLAN_FINAL_VERIFICATION_REQUIRED

- name: operation_type_expectation_must_match_tool
  category: plan_validation
  kind: plan_validation
  mutation: invalid_operation_type
  expected_code: PLAN_EXPECTED_OUTCOME_VALUE_INVALID

- name: only_the_plan_submission_tool_is_accepted
  category: plan_validation
  kind: plan_validation
  mutation: wrong_submission_tool
  expected_code: PLAN_SUBMISSION_TOOL_INVALID
