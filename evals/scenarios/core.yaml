- name: full_command_completes
  category: workflow
  kind: workflow
  assertion: task_succeeded

- name: failed_clearance_triggers_replan
  category: workflow
  kind: workflow
  assertion: replan_created

- name: authority_limit_creates_player_approval
  category: workflow
  kind: workflow
  assertion: player_approval_observed

- name: deterministic_world_reaches_verified_goal
  category: workflow
  kind: workflow
  assertion: final_world_verified

- name: tool_trace_records_before_and_after_state
  category: workflow
  kind: workflow
  assertion: state_audit_recorded

- name: intelligence_only_respects_frozen_scope
  category: goal_scope
  kind: scoped_workflow
  goal: Gather intelligence about the Northern Valley
  assertion: scope_succeeded_without_extra_tools
  expected_scope: [GATHER_VALLEY_INTELLIGENCE]
  forbidden_tools: [start_military_operation, start_outpost_repair, start_trade_route_test]

- name: secure_valley_only_respects_frozen_scope
  category: goal_scope
  kind: scoped_workflow
  goal: Secure the Northern Valley
  assertion: scope_succeeded_without_extra_tools
  expected_scope: [SECURE_NORTHERN_VALLEY]
  forbidden_tools: [start_outpost_repair, start_trade_route_test]

- name: restore_outpost_only_respects_frozen_scope
  category: goal_scope
  kind: scoped_workflow
  goal: Restore Starfire Outpost
  assertion: scope_succeeded_without_extra_tools
  expected_scope: [RESTORE_STARFIRE_OUTPOST]
  forbidden_tools: [start_trade_route_test]

- name: open_trade_keeps_prerequisites_out_of_scope
  category: goal_scope
  kind: scoped_workflow
  goal: Open the Northern Trade Route
  assertion: scope_succeeded_without_extra_tools
  expected_scope: [OPEN_NORTHERN_TRADE_ROUTE]
  forbidden_tools: []

- name: multi_objective_uses_and_scope_without_trade_expansion
  category: goal_scope
  kind: scoped_workflow
  goal: Gather intelligence and restore Starfire Outpost
  assertion: scope_succeeded_without_extra_tools
  expected_scope: [GATHER_VALLEY_INTELLIGENCE, RESTORE_STARFIRE_OUTPOST]
  forbidden_tools: [start_trade_route_test]

- name: full_recovery_resolves_to_explicit_full_scope
  category: goal_scope
  kind: scoped_workflow
  goal: Full northern recovery
  assertion: scope_succeeded_without_extra_tools
  expected_scope: [FULL_NORTHERN_RECOVERY]
  forbidden_tools: []

- name: unknown_tool_is_rejected
  category: plan_validation
  kind: plan_validation
  mutation: unknown_tool
  expected_code: PLAN_TOOL_NOT_ALLOWED

- name: cross_role_tool_assignment_is_rejected
  category: plan_validation
  kind: plan_validation
  mutation: unauthorized_officer
  expected_code: PLAN_TOOL_UNAUTHORIZED

- name: world_wait_cannot_accept_defeat
  category: plan_validation
  kind: plan_validation
  mutation: invalid_world_outcome
  expected_code: PLAN_WORLD_EVENT_OUTCOMES_INVALID

- name: operation_and_wait_must_be_adjacent
  category: plan_validation
  kind: plan_validation
  mutation: broken_operation_pair
  expected_code: PLAN_WORLD_EVENT_PAIRING_INVALID

- name: model_cannot_supply_idempotency_key
  category: plan_validation
  kind: plan_validation
  mutation: model_idempotency_key
  expected_code: PLAN_IDEMPOTENCY_SERVER_CONTROLLED

- name: operation_type_expectation_must_match_tool
  category: plan_validation
  kind: plan_validation
  mutation: invalid_operation_type
  expected_code: PLAN_EXPECTED_OUTCOME_VALUE_INVALID

- name: only_the_plan_submission_tool_is_accepted
  category: plan_validation
  kind: plan_validation
  mutation: wrong_submission_tool
  expected_code: PLAN_SUBMISSION_TOOL_INVALID
